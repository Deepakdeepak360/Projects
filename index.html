<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>📊 AI Sales Predictor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Roboto, sans-serif;
      }

      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #e0f7fa 0%, #e1bee7 100%);
        color: #333;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        text-align: center;
        padding: 60px 20px 30px;
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(8px);
        border-bottom: 2px solid #ddd;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }

      header h1 {
        font-size: 3em;
        margin: 0;
        color: #6a1b9a;
        text-shadow: 1px 1px #fff;
      }

      header p {
        margin-top: 10px;
        font-size: 1.3em;
        color: #555;
      }

      .container {
        max-width: 960px;
        margin: 40px auto;
        padding: 40px;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
        animation: fadeIn 0.8s ease-out;
      }

      form {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        align-items: center;
        margin-bottom: 30px;
      }

      input[type="text"],
      input[type="file"] {
        padding: 12px 18px;
        font-size: 16px;
        border-radius: 12px;
        border: 1px solid #ccc;
        flex: 1 1 40%;
        transition: all 0.3s ease;
        background: #fefefe;
      }

      input:focus {
        outline: none;
        border-color: #7e57c2;
        box-shadow: 0 0 10px rgba(126, 87, 194, 0.3);
      }

      button {
        padding: 12px 28px;
        background: linear-gradient(to right, #7e57c2, #ab47bc);
        border: none;
        color: white;
        font-size: 16px;
        font-weight: bold;
        border-radius: 30px;
        cursor: pointer;
        transition: all 0.3s ease-in-out;
        box-shadow: 0 6px 15px rgba(126, 87, 194, 0.3);
      }

      button:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 25px rgba(126, 87, 194, 0.5);
      }

      .download-area {
        text-align: right;
        margin: 30px 0 10px;
      }

      .download-area button {
        background: linear-gradient(to right, #4caf50, #81c784);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 25px;
        font-weight: bold;
        box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
      }

      .download-area button:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 25px rgba(76, 175, 80, 0.5);
      }

      #loading {
        display: none;
        text-align: center;
        font-weight: bold;
        color: #6a1b9a;
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.4;
        }
      }

      canvas {
        margin-top: 30px;
        border-radius: 15px;
        background: white;
        padding: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 40px;
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }

      th,
      td {
        padding: 16px;
        text-align: center;
      }

      th {
        background-color: #7e57c2;
        color: white;
      }

      tr:nth-child(even) {
        background-color: #f4f4f4;
      }

      tr:hover {
        background-color: #ede7f6;
        transition: background-color 0.2s ease-in-out;
      }

      @media (max-width: 768px) {
        form {
          flex-direction: column;
        }

        input,
        button {
          width: 100%;
        }

        .download-area {
          text-align: center;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>📈 AI Sales Predictor</h1>
      <p>
        Upload past sales data. Get intelligent forecasts with interactive
        visuals!
      </p>
    </header>

    <div class="container">
      <form id="predictForm" enctype="multipart/form-data">
        <input
          type="text"
          id="productName"
          name="productName"
          placeholder="Enter Product Name"
          required
        />
        <input type="file" id="csvFile" name="csvFile" accept=".csv" required />
        <button type="submit">🚀 Predict Now</button>
      </form>

      <div id="loading">🔮 Crunching numbers with AI magic...</div>

      <div class="download-area">
        <button onclick="downloadCSV()">📥 Download Prediction CSV</button>
      </div>

      <canvas id="chart" height="120"></canvas>

      <table id="predictionTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Predicted Sales</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script>
      const form = document.getElementById("predictForm");
      const loading = document.getElementById("loading");
      const chartCanvas = document.getElementById("chart");
      let chartInstance;

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const productName = document.getElementById("productName").value;
        const csvFile = document.getElementById("csvFile").files[0];

        if (!productName || !csvFile) {
          alert("🚨 Please enter a product name and upload a CSV file.");
          return;
        }

        const formData = new FormData();
        formData.append("productName", productName);
        formData.append("csvFile", csvFile);

        loading.style.display = "block";

        fetch("backend/predict.php", {
          method: "POST",
          body: formData,
        })
          .then((res) => res.json())
          .then((data) => {
            loading.style.display = "none";
            console.log("🔍 Server Response:", data); // <-- important for debugging
            if (data.error) {
              alert(
                "❌ " +
                  data.error +
                  (data.details ? "\nDetails: " + data.details : "")
              );
              return;
            }
            renderChart(data);
            populateTable(data);
          })

          .catch(async (err) => {
            loading.style.display = "none";
            const text = await err.text?.(); // added for better info
            console.error("❌ Fetch error:", err, text);
            alert("❌ Prediction failed. Please check console for details.");
          });
      });

      function renderChart(data) {
        const labels = data.map((d) => d.date);
        const values = data.map((d) => d.predicted_sales);

        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(chartCanvas, {
          type: "line",
          data: {
            labels: labels,
            datasets: [
              {
                label: "📊 Predicted Sales",
                data: values,
                borderColor: "#0072ff",
                backgroundColor: "rgba(0,114,255,0.1)",
                pointBackgroundColor: "#0072ff",
                fill: true,
                tension: 0.4,
              },
            ],
          },
          options: {
            responsive: true,
            animation: {
              duration: 1000,
              easing: "easeOutBounce",
            },
            plugins: {
              legend: { display: true },
              tooltip: { mode: "index", intersect: false },
            },
            scales: {
              y: {
                beginAtZero: false,
                ticks: {
                  callback: function (value) {
                    return "₹ " + value.toFixed(0);
                  },
                },
              },
            },
          },
        });
      }

      function populateTable(data) {
        const tbody = document.querySelector("#predictionTable tbody");
        tbody.innerHTML = "";

        data.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${
            row.date
          }</td><td>₹ ${row.predicted_sales.toFixed(2)}</td>`;
          tbody.appendChild(tr);
        });
      }

      function downloadCSV() {
        const link = document.createElement("a");
        link.href = "backend/downloads/predicted_output.csv";
        link.download = "predicted_output.csv";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    </script>
  </body>
</html>
