<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Payment</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        background: linear-gradient(135deg, #f26522, #ff9472);
        font-family: "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }

      .payment-wrapper {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        padding: 40px;
        max-width: 700px;
        width: 100%;
        animation: fadeInUp 0.5s ease-in-out;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h3 {
        text-align: center;
        margin-bottom: 30px;
        color: #333;
      }

      .payment-option {
        padding: 15px;
        border: 2px solid #eee;
        border-radius: 12px;
        margin-bottom: 15px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .payment-option:hover,
      .payment-option.active {
        border-color: #f26522;
        background: #fff5f0;
      }

      .payment-option input {
        margin-right: 10px;
      }

      .card-details,
      .online-details {
        display: none;
        margin-top: 15px;
      }

      .btn-pay {
        background: #f26522;
        border: none;
        color: white;
        font-weight: bold;
      }

      .btn-pay:hover {
        background: #d8531d;
      }

      .back-btn {
        border-radius: 8px;
      }

      .order-summary {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 30px;
        background-color: #f9f9f9;
      }

      .order-summary h5 {
        margin-bottom: 15px;
        color: #333;
      }

      .order-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .order-total {
        font-weight: bold;
        font-size: 1.1rem;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="payment-wrapper">
      <h3><i class="fas fa-lock"></i> Secure Payment</h3>

      <div class="order-summary" id="order-summary">
        <h5>🛍️ Order Summary</h5>
        <div id="order-items"></div>
        <div class="order-total">
          Total: ₹<span id="order-total">0.00</span>
        </div>
      </div>

      <form onsubmit="return handlePayment(event)">
        <div class="payment-option" onclick="selectPayment(this)">
          <label
            ><input type="radio" name="payment" value="card" required /> 💳
            Credit / Debit Card</label
          >
          <div class="card-details">
            <input
              type="text"
              class="form-control my-2 card-input"
              placeholder="Card Number"
            />
            <input
              type="text"
              class="form-control my-2 card-input"
              placeholder="Card Holder Name"
            />
            <div class="d-flex">
              <input
                type="text"
                class="form-control mr-2 card-input"
                placeholder="MM/YY"
              />
              <input
                type="text"
                class="form-control card-input"
                placeholder="CVV"
              />
            </div>
          </div>
        </div>

        <div class="payment-option" onclick="selectPayment(this)">
          <label
            ><input type="radio" name="payment" value="online" /> 🌐 Online
            Payment (UPI/Netbanking)</label
          >
          <div class="online-details">
            <input
              type="text"
              class="form-control my-2 online-input"
              placeholder="Enter UPI ID"
            />
            <input
              type="password"
              class="form-control online-input"
              placeholder="Enter OTP"
            />
          </div>
        </div>

        <div class="payment-option" onclick="selectPayment(this)">
          <label
            ><input type="radio" name="payment" value="cod" /> 💵 Cash on
            Delivery</label
          >
        </div>

        <button type="submit" class="btn btn-pay btn-block mt-4">
          Complete Payment
        </button>
        <a href="cart.html" class="btn btn-outline-dark btn-block back-btn mt-2"
          >⬅ Back to Cart</a
        >
      </form>
    </div>

    <script>
      function selectPayment(element) {
        document.querySelectorAll(".payment-option").forEach((opt) => {
          opt.classList.remove("active");
          const cardDetails = opt.querySelector(".card-details");
          const onlineDetails = opt.querySelector(".online-details");
          if (cardDetails) cardDetails.style.display = "none";
          if (onlineDetails) onlineDetails.style.display = "none";
        });

        element.classList.add("active");
        const input = element.querySelector('input[type="radio"]');
        input.checked = true;

        const cardDetails = element.querySelector(".card-details");
        const onlineDetails = element.querySelector(".online-details");
        if (cardDetails) cardDetails.style.display = "block";
        if (onlineDetails) onlineDetails.style.display = "block";
      }

      function handlePayment(event) {
        event.preventDefault();

        const method = document.querySelector(
          'input[name="payment"]:checked'
        )?.value;
        if (!method) {
          alert("Please select a payment method.");
          return false;
        }

        if (method === "card") {
          const cardInputs = document.querySelectorAll(".card-details input");
          for (let input of cardInputs) {
            if (!input.value.trim()) {
              alert("Please fill in all card details.");
              return false;
            }
          }
        }

        if (method === "online") {
          const onlineInputs = document.querySelectorAll(
            ".online-details input"
          );
          for (let input of onlineInputs) {
            if (!input.value.trim()) {
              alert("Please enter UPI ID and OTP.");
              return false;
            }
          }
        }

        // Prepare data
        const cart = JSON.parse(localStorage.getItem("cart") || "{}");
        if (Object.keys(cart).length === 0) {
          alert("Your cart is empty.");
          return false;
        }

        fetch("http://localhost:8000/frontend/backend/fetch_products.php")
          .then((res) => res.json())
          .then((products) => {
            const cartItems = [];
            let total = 0;

            for (let pid in cart) {
              const product = products.find((p) => p.id == pid);
              if (!product) continue;

              const quantity = cart[pid];
              const subtotal = product.price * quantity;
              total += subtotal;

              cartItems.push({
                name: product.name,
                price: parseFloat(product.price),
                image: product.image,
                category_id: parseInt(product.category_id),
                quantity: parseInt(quantity),
              });
            }

            const payload = {
              cart: cartItems,
              total: total,
            };

            return fetch(
              "http://localhost:8000/frontend/backend/save_order.php",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(payload),
              }
            );
          })
          .then((res) => res.json())
          .then((response) => {
            if (response.status === "success") {
              alert(
                "✅ Payment method: " +
                  method +
                  "\n🧾 Order ID: " +
                  response.order_id +
                  "\nThank you for your purchase!"
              );
              localStorage.removeItem("cart");
              window.location.href = "index.html";
            } else {
              alert(
                "❌ Order failed: " + (response.message || "Unknown error")
              );
            }
          })
          .catch((err) => {
            console.error("Order Error:", err);
            alert("❌ Failed to place order. Try again later.");
          });
      }
      function displayOrderSummary() {
        const cart = JSON.parse(localStorage.getItem("cart") || "{}");
        const orderItemsContainer = document.getElementById("order-items");
        const orderTotal = document.getElementById("order-total");
        orderItemsContainer.innerHTML = "";
        orderTotal.innerText = "0.00";

        if (Object.keys(cart).length === 0) {
          orderItemsContainer.innerHTML = "<p>Your cart is empty.</p>";
          return;
        }

        fetch("http://localhost:8000/frontend/backend/fetch_products.php")
          .then((res) => res.json())
          .then((products) => {
            let total = 0;

            for (let pid in cart) {
              const product = products.find((p) => p.id == pid);
              if (!product) continue;

              const quantity = cart[pid];
              const subtotal = product.price * quantity;
              total += subtotal;

              const item = document.createElement("div");
              item.className = "order-item";
              item.innerHTML = `
            <span>${product.name} × ${quantity}</span>
            <span>₹${subtotal.toFixed(2)}</span>
          `;
              orderItemsContainer.appendChild(item);
            }

            orderTotal.innerText = total.toFixed(2);
          })
          .catch((err) => {
            orderItemsContainer.innerHTML =
              "<p class='text-danger'>Failed to load order summary.</p>";
            console.error("Order summary error:", err);
          });
      }

      // Run on page load
      window.addEventListener("DOMContentLoaded", displayOrderSummary);
    </script>
  </body>
</html>
